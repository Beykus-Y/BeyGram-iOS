name: BeyGramIOS

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"

# Pinned to the commit whose Package.swift references TDLib 1.8.68-ab8d769f.
# This package includes TDLibFramework's iOS XCFramework binary.
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    revision: 3996b5f55bee434a2694d6384b8a7ff320f3efaf

targets:
  BeyGramIOS:
    type: application
    platform: iOS
    sources:
      - path: BeyGramIOS
    dependencies:
      - package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beykus.beygram.ios
        PRODUCT_NAME: BeyGramIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BeyGram
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_TelegramAPIID: "$(TELEGRAM_API_ID)"
        INFOPLIST_KEY_TelegramAPIHash: "$(TELEGRAM_API_HASH)"
        TELEGRAM_API_ID: "0"
        TELEGRAM_API_HASH: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  BeyGramIOS:
    build:
      targets:
        BeyGramIOS: all
    run:
      config: Debug
    archive:
      config: Release
