name: BeyGram iOS

on:
  push:
    branches: [main, DEV]
    tags: ['ios-v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show build environment
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build for physical iPhone (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project BeyGramIOS.xcodeproj \
            -scheme BeyGramIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BeyGramDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BeyGramDerivedData/Build/Products/Release-iphoneos/BeyGramIOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/BeyGramIOS.app"
          (
            cd "$RUNNER_TEMP/ipa"
            zip -qry "$GITHUB_WORKSPACE/BeyGram-iOS-unsigned.ipa" Payload
          )
          unzip -l "$GITHUB_WORKSPACE/BeyGram-iOS-unsigned.ipa" | grep 'Payload/BeyGramIOS.app/'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeyGram-iOS-unsigned
          path: BeyGram-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish unsigned prerelease
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BeyGram-iOS-unsigned

      - name: Create prerelease with IPA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" BeyGram-iOS-unsigned.ipa \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TAG — unsigned UI prototype" \
            --notes "Unsigned IPA for development only. Requires appropriate Apple signing before installation. Telegram/TDLib functionality is not implemented yet." \
            --prerelease
