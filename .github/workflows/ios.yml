name: BeyGram iOS

on:
  push:
    branches: [main, DEV]
    tags: ['ios-v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show build environment
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Configure Telegram API for trusted runs
        env:
          TELEGRAM_API_ID: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_HASH || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR builds always use placeholders; no credentials exposed to PR code.
            printf 'TELEGRAM_API_ID = 0\nTELEGRAM_API_HASH = \n' > ios/TelegramCredentials.xcconfig
          else
            if ! [[ "$TELEGRAM_API_ID" =~ ^[1-9][0-9]*$ ]] || ! [[ "$TELEGRAM_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "::error::Configure TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets."
              exit 1
            fi
            {
              printf 'TELEGRAM_API_ID = %s\n' "$TELEGRAM_API_ID"
              printf 'TELEGRAM_API_HASH = %s\n' "$TELEGRAM_API_HASH"
            } > ios/TelegramCredentials.xcconfig
          fi

      - name: Resolve Swift dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BeyGramIOS.xcodeproj \
            -scheme BeyGramIOS

      - name: Build for physical iPhone (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project BeyGramIOS.xcodeproj \
            -scheme BeyGramIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BeyGramDerivedData" \
            -xcconfig TelegramCredentials.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged API configuration
        env:
          TELEGRAM_API_ID: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_HASH || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          plist_path = Path(os.environ["RUNNER_TEMP"]) / "BeyGramDerivedData/Build/Products/Release-iphoneos/BeyGramIOS.app/Info.plist"
          with plist_path.open("rb") as stream:
              info = plistlib.load(stream)
          embedded_id = str(info.get("TelegramAPIID", ""))
          embedded_hash = str(info.get("TelegramAPIHash", ""))
          if os.environ["EVENT_NAME"] == "pull_request":
              assert embedded_id in {"0", ""} and not embedded_hash, "PR must not embed production credentials"
          else:
              assert embedded_id == os.environ["TELEGRAM_API_ID"], "Telegram API ID not embedded"
              assert embedded_hash == os.environ["TELEGRAM_API_HASH"], "Telegram API Hash not embedded"
          print("Info.plist Telegram configuration verified (values not printed).")
          PY

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BeyGramDerivedData/Build/Products/Release-iphoneos/BeyGramIOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/BeyGramIOS.app"
          (
            cd "$RUNNER_TEMP/ipa"
            zip -qry "$GITHUB_WORKSPACE/BeyGram-iOS-unsigned.ipa" Payload
          )
          unzip -l "$GITHUB_WORKSPACE/BeyGram-iOS-unsigned.ipa" | grep 'Payload/BeyGramIOS.app/'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeyGram-iOS-unsigned
          path: BeyGram-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish unsigned prerelease
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BeyGram-iOS-unsigned

      - name: Create prerelease with IPA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" BeyGram-iOS-unsigned.ipa \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TAG — unsigned iOS build" \
            --notes "Unsigned iOS build. Requires appropriate Apple signing before installation. Telegram login supports phone/code/password; chats and message sending are not implemented yet." \
            --prerelease
